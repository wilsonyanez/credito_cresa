config_version: 1
source_name: credito_cresa
source_type: databricks
enabled: true

input:
  catalog: cresa_dev
  schema: credito_cresa_source
  format: parquet
  seed_catalog: cresa_dev
  seed_schema: landing
  seed_volume: source_seed

discovery:
  ingestion_config_glob: >-
    pre_productiva/config/ingestion/**/*.yml
  recursive: true
  include_disabled: false

output:
  format: parquet
  catalog: cresa_dev
  schema: bronze
  volume: data
  base_path: credito_cresa
  register_tables: true
  table_catalog: cresa_dev
  table_schema: bronze
  write_mode: overwrite
  compression: snappy

execution:
  continue_on_error: true
  fail_job_on_any_error: true
  max_parallel_tables: 1

control_plane:
  enabled: true
  catalog: cresa_dev
  schema: audit01
  runs_table: ingestion_runs
  table_runs_table: ingestion_table_runs
  columns_table: ingestion_columns
  watermarks_table: ingestion_watermarks
