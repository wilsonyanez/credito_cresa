config_version: 1
source_name: credito_cresa
source_schema: dbo
source_table: cat_estadoverificacion
source_table_normalized: cat_estadoverificacion
enabled: true

description: "Catálogo de estados de verificación desde CREDITO_CRESA. Ingesta a Bronze para consumo de dominios Cliente, Producto y Crédito. Incluye clasificación de verificación y resolución."
priority:
  wave: fase_3_ingesta
  score: 7
  reason: "Tabla de maestro crítica para gestión de estados en procesos de vinculación, KYC y conformación de Cliente. Requerido antes del 1 oct 2026 (switch Salesforce). Dependencia: cat_tipoverificacion."

load_strategy:
  initial_mode: full_snapshot
  incremental_mode: delta_incremental
  watermark_column: null
  sequence_column: id
  delta_lookback_days: 1
  delete_detection: true

read:
  mode: table

primary_key:
  columns:
    - id
  enforced_in_source: true

natural_key:
  columns:
    - nombre
    - tipo_verificacion

columns:
  include:
    - id
    - nombre
    - activo
    - tipo_verificacion
    - resolutivo
    - naturaleza
  exclude: []
  rename:
    activo: es_activo
  pii_columns: []
  restricted_columns:
    - tipo_verificacion
    - naturaleza

target:
  bronze_catalog: dlh_cresa
  bronze_schema: bronze
  bronze_table: credito_cresa_cat_estadoverificacion
  write_mode_initial: overwrite
  write_mode_delta: merge
  merge_strategy: upsert_by_primary_key
  partition_by: es_activo
  cluster_by: tipo_verificacion

audit_columns:
  add_ingestion_metadata: true
  add_record_hash: true
  add_schema_hash: true
  add_source_watermark: true
  add_execution_timestamp: true
  add_row_number: true

governance:
  domain_official: Maestro
  sensitivity: Confidencial
  data_owner: "Equipo de Datos - Maestro (por asignar oficialmente)"
  purview_collection: 01_Maestros
  classification_level: L2_Confidencial
  retention_policy: Permanente

control_plane:
  run_table: dlh_cresa.audit01.gobierno_silver_reglas
  watermark_table: dlh_cresa.audit01.dynamics_odata_run_summary
  error_table: dlh_cresa.audit01.log_procesos
  quality_table: dlh_cresa.audit01.control_calidad_ingestion

validation_rules:
  - name: "verificar_ids_unicos"
    rule: "PRIMARY_KEY_CHECK"
    column: "id"
    severity: "CRITICAL"
    
  - name: "validar_activo_binario"
    rule: "VALUE_IN_LIST"
    column: "es_activo"
    allowed_values: [0, 1]
    severity: "HIGH"
    
  - name: "validar_nombre_no_nulo"
    rule: "NOT_NULL"
    column: "nombre"
    severity: "CRITICAL"
    
  - name: "validar_tipo_verificacion_no_nulo"
    rule: "NOT_NULL"
    column: "tipo_verificacion"
    severity: "HIGH"
    
  - name: "validar_resolutivo_binario"
    rule: "VALUE_IN_LIST"
    column: "resolutivo"
    allowed_values: [0, 1, NULL]
    severity: "MEDIUM"

alert_rules:
  - condition: "row_count_change > 30%"
    severity: "MEDIUM"
    action: "NOTIFY_TEAM"
    
  - condition: "execution_time > 300"
    severity: "MEDIUM"
    action: "NOTIFY_DBA"
    
  - condition: "validation_failures > 0"
    severity: "CRITICAL"
    action: "BLOCK_AND_ALERT"
    recipients:
      - "data-owner@empresa.local"
      - "data-platform-team@empresa.local"
    smtp_config:
      host: "smtp.empresa.local"
      port: 587
      use_tls: true
      from_address: "databricks-alerts@empresa.local"

quality_metrics:
  track_record_count: true
  track_nulls: true
  track_duplicates: true
  track_execution_time: true
  track_data_drift: true
