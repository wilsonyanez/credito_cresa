config_version: 1
source_name: credito_cresa
source_schema: dbo
source_table: cat_modelo_aprobador
source_table_normalized: cat_modelo_aprobador
enabled: true

description: "Catálogo modelo aprobador desde CREDITO_CRESA. Ingesta a Bronze para consumo de dominios."
priority:
  wave: fase_3_ingesta
  score: 6
  reason: "Tabla de referencia utilizada por modelos de scoring y reglas de aprobación."

load_strategy:
  initial_mode: full_snapshot
  incremental_mode: incremental_datetime
  watermark_column: fecha_modificacion
  sequence_column: null
  delta_lookback_days: 2
  delete_detection: false

read:
  mode: table

primary_key:
  columns:
    - id
  enforced_in_source: true

natural_key:
  columns:
    - calificacion_buro_id
    - calificacion_confianza_id
    - calificacion_final_id
    - origen_id
    - zona_riesgo_id
    - tipo_cliente_id
    - dependencia_id
    - grupo_id
    - unidadnegocio_id
    - canal_id

columns:
  include:
    - id
    - calificacion_buro_id
    - calificacion_confianza_id
    - calificacion_final_id
    - origen_id
    - zona_riesgo_id
    - tipo_cliente_id
    - dependencia_id
    - grupo_id
    - edad_min
    - edad_max
    - nacionalidad
    - capacidad_pago
    - tipo_verificacion
    - entrada_base
    - es_activo
    - fecha_creacion
    - actualizado
    - creado_por
    - actualizado_por
    - unidadnegocio_id
    - canal_id
  exclude: []
  rename: {}
  pii_columns: []
  restricted_columns: []

target:
  bronze_catalog: dlh_cresa
  bronze_schema: bronze
  bronze_table: credito_cresa_cat_modelo_aprobador
  write_mode_initial: overwrite
  write_mode_delta: merge
  merge_strategy: upsert_by_primary_key

audit_columns:
  add_ingestion_metadata: true
  add_record_hash: true
  add_schema_hash: true
  add_source_watermark: true

governance:
  domain_official: Maestro
  sensitivity: Confidencial
  data_owner: "Equipo Modelos y Riesgos"
  purview_collection: 02_Modelos

control_plane:
  run_table: dlh_cresa.audit01.gobierno_silver_reglas
  watermark_table: dlh_cresa.audit01.dynamics_odata_run_summary
  error_table: dlh_cresa.audit01.log_procesos
