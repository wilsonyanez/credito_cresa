config_version: 1
source_name: credito_cresa
source_schema: dbo
source_table: cat_profesion
source_table_normalized: cat_profesion
enabled: true

description: "Catálogo de profesiones desde CREDITO_CRESA. Ingesta a Bronze para consumo de dominios clientes."
priority:
	wave: fase_3_ingesta
	score: 6
	reason: "Tabla maestra requerida para clasificar la profesión de clientes y operaciones."

load_strategy:
	initial_mode: full_snapshot
	incremental_mode: delta_incremental
	watermark_column: actualizado
	sequence_column: id
	delta_lookback_days: 1
	delete_detection: true

read:
  mode: table

primary_key:
	columns:
		- id
	enforced_in_source: true

natural_key:
	columns:
		- nombre

columns:
	include:
		- id
		- nombre
		- es_activo

	exclude: []
	rename: {}
	pii_columns:
		- creado_por
		- actualizado_por
		- gestor_id
	restricted_columns: []

target:
	bronze_catalog: dlh_cresa
	bronze_schema: bronze
	bronze_table: credito_cresa_cat_profesion
	write_mode_initial: overwrite
	write_mode_delta: merge
	merge_strategy: upsert_by_primary_key
	partition_by: es_activo
	cluster_by: cat_zona_id

audit_columns:
	add_ingestion_metadata: true
	add_record_hash: true
	add_schema_hash: true
	add_source_watermark: true
	add_execution_timestamp: true
	add_row_number: true

governance:
	domain_official: Maestro
	sensitivity: Confidencial
	data_owner: "Equipo de Datos - Maestro (por asignar oficialmente)"
	purview_collection: 01_Maestros
	classification_level: L2_Confidencial
	retention_policy: Permanente

control_plane:
	run_table: dlh_cresa.audit01.gobierno_silver_reglas
	watermark_table: dlh_cresa.audit01.dynamics_odata_run_summary
	error_table: dlh_cresa.audit01.log_procesos
	quality_table: dlh_cresa.audit01.control_calidad_ingestion

validation_rules:
	- name: "verificar_ids_unicos"
		rule: "PRIMARY_KEY_CHECK"
		column: "id"
		severity: "CRITICAL"

	- name: "validar_es_activo_binario"
		rule: "VALUE_IN_LIST"
		column: "es_activo"
		allowed_values: [0, 1]
		severity: "HIGH"

	- name: "validar_nombre_no_nulo"
		rule: "NOT_NULL"
		column: "nombre"
		severity: "CRITICAL"

	- name: "validar_cat_zona_id_no_nulo"
		rule: "NOT_NULL"
		column: "cat_zona_id"
		severity: "HIGH"

	- name: "validar_fechas_consistentes"
		rule: "DATE_ORDER_CHECK"
		columns:
			start: "creado"
			end: "actualizado"
		severity: "MEDIUM"

	- name: "validar_actualizado_no_futuro"
		rule: "DATE_NOT_IN_FUTURE"
		column: "actualizado"
		severity: "HIGH"

alert_rules:
	- condition: "row_count_change > 30%"
		severity: "MEDIUM"
		action: "NOTIFY_TEAM"

	- condition: "execution_time > 300"
		severity: "MEDIUM"
		action: "NOTIFY_DBA"
		recipients:
			- "dba-team@empresa.local"

	- condition: "validation_failures > 0"
		severity: "CRITICAL"
		action: "BLOCK_AND_ALERT"
		recipients:
			- "data-owner@empresa.local"
			- "data-platform-team@empresa.local"
		smtp_config:
			host: "smtp.empresa.local"
			port: 587
			use_tls: true
			from_address: "databricks-alerts@empresa.local"

quality_metrics:
	track_record_count: true
	track_nulls: true
	track_duplicates: true
	track_execution_time: true
	track_data_drift: true
