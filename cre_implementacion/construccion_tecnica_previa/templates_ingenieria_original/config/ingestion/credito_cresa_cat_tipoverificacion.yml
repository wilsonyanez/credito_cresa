config_version: 1
source_name: credito_cresa
source_schema: dbo
source_table: cat_tipoverificacion
source_table_normalized: cat_tipoverificacion
enabled: true

description: "Catálogo de tipos de verificación desde CREDITO_CRESA. Ingesta a Bronze para consumo de dominios Cliente y Producto. Incluye metadatos de control, jerarquía y auditoría."
priority:
  wave: fase_3_ingesta
  score: 6
  reason: "Tabla de maestro crítica para validación de procesos de préstamo, vinculación y conformación de Cliente. Requerido antes del 1 oct 2026 (switch Salesforce)."

load_strategy:
  initial_mode: full_snapshot
  incremental_mode: full_snapshot
  watermark_column: actualizado
  sequence_column: id
  delta_lookback_days: 1
  delete_detection: true

query:
  custom_sql: "SELECT id,nombre,jerarquia,estado,creado,actualizado,creado_por,actualizado_por,naturaleza FROM CREDITO_CRESA.dbo.cat_tipoverificacion WITH (NOLOCK)"
  where_clause: "WHERE estado = 1"
  order_by: "id ASC"

primary_key:
  columns:
    - id
  enforced_in_source: true

natural_key:
  columns:
    - nombre
    - jerarquia

columns:
  include:
    - id
    - nombre
    - jerarquia
    - estado
    - creado
    - actualizado
    - creado_por
    - actualizado_por
    - naturaleza
  exclude: []
  rename:
    creado: fecha_creacion
    actualizado: fecha_actualizacion
  pii_columns:
    - creado_por
    - actualizado_por
  restricted_columns:
    - naturaleza

target:
  bronze_catalog: dlh_cresa
  bronze_schema: bronze
  bronze_table: credito_cresa_cat_tipoverificacion
  write_mode_initial: overwrite
  write_mode_delta: merge
  merge_strategy: upsert_by_primary_key
  partition_by: estado
  cluster_by: jerarquia

audit_columns:
  add_ingestion_metadata: true
  add_record_hash: true
  add_schema_hash: true
  add_source_watermark: true
  add_execution_timestamp: true
  add_row_number: true

governance:
  domain_official: Maestro
  sensitivity: Confidencial
  data_owner: "Equipo de Datos - Maestro (por asignar oficialmente)"
  purview_collection: 01_Maestros
  classification_level: L2_Confidencial
  retention_policy: Permanente

control_plane:
  run_table: dlh_cresa.audit01.gobierno_silver_reglas
  watermark_table: dlh_cresa.audit01.dynamics_odata_run_summary
  error_table: dlh_cresa.audit01.log_procesos
  quality_table: dlh_cresa.audit01.control_calidad_ingestion
  
validation_rules:
  - name: "verificar_ids_unicos"
    rule: "PRIMARY_KEY_CHECK"
    column: "id"
    severity: "CRITICAL"
    
  - name: "validar_estado_binario"
    rule: "VALUE_IN_LIST"
    column: "estado"
    allowed_values: [0, 1]
    severity: "HIGH"
    
  - name: "validar_fecha_creacion"
    rule: "DATE_NOT_FUTURE"
    column: "creado"
    severity: "HIGH"
    
  - name: "validar_nombre_no_nulo"
    rule: "NOT_NULL"
    column: "nombre"
    severity: "CRITICAL"
    
  - name: "validar_jerarquia_no_nulo"
    rule: "NOT_NULL"
    column: "jerarquia"
    severity: "HIGH"

alert_rules:
  - condition: "row_count_change > 50%"
    severity: "MEDIUM"
    action: "NOTIFY_TEAM"
    
  - condition: "execution_time > 300"
    severity: "MEDIUM"
    action: "NOTIFY_DBA"
    
  - condition: "validation_failures > 0"
    severity: "CRITICAL"
    action: "BLOCK_AND_ALERT"
    recipients:
      - "data-owner@empresa.local"
      - "data-platform-team@empresa.local"
    smtp_config:
      host: "smtp.empresa.local"
      port: 587
      use_tls: true
      from_address: "databricks-alerts@empresa.local"

quality_metrics:
  track_record_count: true
  track_nulls: true
  track_duplicates: true
  track_execution_time: true
  track_data_drift: true
